<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock paper scissors game</title>
  <link rel="icon" href="./icons/rock-paper-scissors.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="container">
    <div class="game">
      <!--game-top-->
      <div class="game-info">
        <div class="player-score-display">
          You : <span class="player-score"></span>
        </div>
        <div class="computer-score-display">
          Computer : <span class="computer-score"></span>
        </div>
      </div>
      <!--game-top-->

      <!--game middile-->
      <div class="game-table">
        <div class="player-side-choice">
          <!--choice showen when selected-->
        </div>
        <div class="computer-side-choice">
          <!--choice showen dynamically-->
        </div>
      </div>
      <!--game middile-->

      <!--game controlls-->
      <div class="game-controlls">
        <div class="btn btn-outline-secondary">
          <img id="rock" src="./icons/rock.png" alt="rock button">
        </div>
        
        <div class="btn btn-outline-secondary">
          <img id="paper" src="./icons/paper.png" alt="paper button">
        </div>

        <div class="btn btn-outline-secondary">
          <img id="scissor" src="./icons/scissor.png" alt="scissor button">
        </div>
      </div>
      <!--game controlls-->

    </div>
  </div>

  <script src="./js/game.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
